<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PC Build Tracker</title>
    <link rel="stylesheet" href="style.css">

</head>

<body>
    <h1>PC Build Tracker</h1>
    <p>Build & track your very own custom PC</p>

    <form id="form">
        <label for="compName">Component name:</label>
        <input type="text" id="compName" name="compName" placeholder="MSI Gaming X Trio 4070 Ti">
        <label for="cat" >Category:</label>
        <input type="text" name="cat" id="cat" placeholder="GPU">
        <label for="price">Price:</label>
        <input type="number" name="price" id="price" placeholder="1100">
        <button id="addComponent" type="submit">Add component</button>
    </form>
     

    <h2>Your Build</h2>
    <p>No components added yet...</p>

    <script src="script.js" defer></script>
    <!-- 'defer' is not necessary here since its at the very bottom of <body>, but is fine to leave here. -->
</body>

</html>
